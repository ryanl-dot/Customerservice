# Render Blueprint (staging). Review before applying — creating these services on
# Render provisions billable resources. Do NOT commit real secret values; set them in
# the Render dashboard (marked sync:false below) after the services exist.

services:
  - type: web
    name: solarcs-staging
    runtime: docker
    plan: starter            # smallest paid tier; confirm cost before creating
    healthCheckPath: /api/health
    # Apply DB migrations on each release, then start the same-origin server.
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: APP_MODE
        value: production
      - key: NODE_ENV
        value: production
      - key: DATA_MODE
        value: production
      - key: USER_STORE
        value: db
      - key: AUTH_DISABLE_SEED
        value: "1"
      - key: PORT
        value: "8787"
      - key: SERVE_SPA
        value: "1"
      - key: FRONTEND_ORIGIN
        sync: false          # set to the staging URL, e.g. https://solarcs-staging.onrender.com
      - key: API_ORIGIN
        sync: false
      - key: COOKIE_SECRET
        generateValue: true  # Render generates a stable random value (not per-restart)
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_MS
        value: "28800000"
      - key: DATABASE_URL
        fromDatabase:
          name: solarcs-staging-db
          property: connectionString

databases:
  - name: solarcs-staging-db
    plan: basic-256mb        # smallest paid tier; confirm cost before creating
    postgresMajorVersion: "16"
